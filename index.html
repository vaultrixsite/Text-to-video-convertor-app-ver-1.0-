<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Studio with Download</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --accent: #22c55e;
            --accent-hover: #16a34a;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }

        h2 {
            font-size: 1.3rem;
            margin-bottom: 12px;
            text-align: center;
            color: var(--primary);
        }

        .input-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        textarea {
            width: 100%;
            height: 100px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: var(--text);
            padding: 10px;
            font-size: 0.95rem;
            resize: none;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        .controls-row {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .controls-row select {
            flex: 1;
            background: #0f172a;
            color: var(--text);
            border: 1px solid #334155;
            padding: 8px;
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .btn-group {
            display: flex;
            gap: 8px;
        }

        .btn {
            flex: 1;
            background: var(--primary);
            color: white;
            border: none;
            padding: 11px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background: var(--primary-hover);
        }

        .btn-download {
            background: var(--accent);
        }
        .btn-download:hover {
            background: var(--accent-hover);
        }

        .btn:disabled {
            background: #475569;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .video-viewport {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 10px;
            margin-top: 15px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #334155;
        }

        .video-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.75;
        }

        .video-text-overlay {
            position: relative;
            z-index: 2;
            padding: 15px;
            text-align: center;
            font-size: 1.1rem;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 0 2px 6px rgba(0,0,0,0.9);
        }

        .watermark {
            position: absolute;
            bottom: 6px;
            right: 10px;
            font-size: 0.7rem;
            color: rgba(255,255,255,0.7);
            z-index: 3;
            background: rgba(0,0,0,0.4);
            padding: 2px 6px;
            border-radius: 4px;
        }

        .progress-bar-container {
            width: 100%;
            height: 4px;
            background: #334155;
            margin-top: 10px;
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: var(--primary);
            transition: width 0.1s linear;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🎬 AI Video Studio + Download</h2>
        
        <div class="input-group">
            <label for="storyText">Apna Text/Script Yahan Daalein:</label>
            <textarea id="storyText">A big elephant lived in a dense green jungle. Every morning, he went near the cold river water. A cute baby elephant played with its trunk happily.</textarea>
        </div>

        <div class="controls-row">
            <div>
                <label for="speedSelect">Scene Speed:</label>
                <select id="speedSelect">
                    <option value="4000">4 Seconds</option>
                    <option value="5000" selected>5 Seconds</option>
                    <option value="6000">6 Seconds</option>
                </select>
            </div>
        </div>

        <div class="btn-group">
            <button id="generateBtn" class="btn" onclick="startVideoGeneration()">Play Video</button>
            <button id="downloadBtn" class="btn btn-download" disabled>Save Video</button>
        </div>

        <div class="video-viewport">
            <canvas id="renderCanvas" style="display:none;"></canvas>
            <img id="sceneImage" class="video-bg" src="" alt="AI Visual">
            <div id="sceneText" class="video-text-overlay">Press Play Video to Start</div>
            <div class="watermark">AI Studio</div>
        </div>

        <div class="progress-bar-container">
            <div id="progressBar" class="progress-bar"></div>
        </div>
    </div>

    <script>
        let synth = window.speechSynthesis;
        let isPlaying = false;
        let currentTimeout = null;
        let mediaRecorder;
        let recordedChunks = [];

        function startVideoGeneration() {
            if (isPlaying) {
                stopVideo();
                return;
            }

            const rawText = document.getElementById('storyText').value.trim();
            if (!rawText) {
                alert("Kripya kuch script text enter karein!");
                return;
            }

            let sentences = rawText.split('.').map(s => s.trim()).filter(s => s.length > 0);
            const sceneDuration = parseInt(document.getElementById('speedSelect').value);
            
            const btn = document.getElementById('generateBtn');
            const downloadBtn = document.getElementById('downloadBtn');
            
            btn.innerText = "Stop / Reset";
            btn.style.background = "#ef4444";
            downloadBtn.disabled = true;
            isPlaying = true;

            // Setup Canvas for Recording
            const canvas = document.getElementById('renderCanvas');
            canvas.width = 800;
            canvas.height = 450;
            const ctx = canvas.getContext('2d');

            let stream = canvas.captureStream(30); // 30 FPS stream
            try {
                mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
                recordedChunks = [];
                
                mediaRecorder.ondataavailable = function(e) {
                    if (e.data.size > 0) recordedChunks.push(e.data);
                };
                
                mediaRecorder.onstop = function() {
                    let blob = new Blob(recordedChunks, { type: 'video/webm' });
                    let url = URL.createObjectURL(blob);
                    
                    downloadBtn.disabled = false;
                    downloadBtn.onclick = function() {
                        let a = document.createElement('a');
                        a.href = url;
                        a.download = 'ai-story-video.webm';
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                    };
                };
                
                mediaRecorder.start();
            } catch (err) {
                console.log("MediaRecorder error: ", err);
            }

            let currentIndex = 0;
            const totalSteps = sentences.length;
            const progressBar = document.getElementById('progressBar');

            function playScene() {
                if (!isPlaying || currentIndex >= sentences.length) {
                    stopVideo();
                    return;
                }

                let currentSentence = sentences[currentIndex] + ".";
                document.getElementById('sceneText').innerText = currentSentence;
                
                let encodedPrompt = encodeURIComponent(currentSentence);
                let imgUrl = `https://pollinations.ai/p/${encodedPrompt}?width=800&height=450&nologo=true`;
                
                const imgElement = document.getElementById('sceneImage');
                imgElement.src = imgUrl;

                // Draw frame to canvas for recording
                imgElement.onload = function() {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(imgElement, 0, 0, canvas.width, canvas.height);
                    
                    // Dark gradient overlay for text readability on video
                    ctx.fillStyle = "rgba(0, 0, 0, 0.45)";
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    
                    ctx.fillStyle = "#ffffff";
                    ctx.font = "bold 24px sans-serif";
                    ctx.textAlign = "center";
                    ctx.fillText(currentSentence, canvas.width / 2, canvas.height - 50);
                };

                if (synth) {
                    synth.cancel();
                    let utterance = new SpeechSynthesisUtterance(currentSentence);
                    synth.speak(utterance);
                }

                let progressPercent = ((currentIndex + 1) / totalSteps) * 100;
                progressBar.style.width = `${progressPercent}%`;

                currentIndex++;
                currentTimeout = setTimeout(playScene, sceneDuration);
            }

            playScene();
        }

        function stopVideo() {
            isPlaying = false;
            if (synth) synth.cancel();
            if (currentTimeout) clearTimeout(currentTimeout);
            
            if (mediaRecorder && mediaRecorder.state !== "inactive") {
                mediaRecorder.stop();
            }

            const btn = document.getElementById('generateBtn');
            btn.innerText = "Play Video";
            btn.style.background = "var(--primary)";
            
            document.getElementById('sceneText').innerText = "Video Finished / Stopped. Click Save Video to Download.";
            document.getElementById('progressBar').style.width = "0%";
        }
    </script>
</body>
</html>
