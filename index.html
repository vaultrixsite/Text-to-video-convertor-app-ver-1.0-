<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Studio Pro + Context Visuals</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-3 sm:p-6">

    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-4 sm:p-6 shadow-2xl">
        <h2 class="text-xl font-bold text-center mb-4 text-indigo-400 flex items-center justify-center gap-2">
            <span>🎬</span> AI Video Studio Pro
        </h2>
        
        <div class="mb-4">
            <label for="storyText" class="block text-xs font-semibold text-slate-400 mb-1">Apna Text/Script Yahan Daalein (Horror ya Animal):</label>
            <textarea id="storyText" class="w-full h-32 bg-slate-950 border border-slate-700 rounded-xl p-3 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 resize-none">The heavy iron gates of Blackwood Manor groaned open as the midnight fog crept over the desolate estate, wrapping its cold fingers around the crumbling stone walls. Arthur clutched his trembling flashlight tighter, its weak beam cutting through the impenetrable darkness like a fragile sword. Reflected in the glass was not the empty library behind him, but a tall, shadowy figure with long, jagged claws standing mere inches away.</textarea>
        </div>

        <div class="grid grid-cols-2 gap-3 mb-4">
            <div>
                <label for="speedSelect" class="block text-xs font-semibold text-slate-400 mb-1">Scene Speed:</label>
                <select id="speedSelect" class="w-full bg-slate-950 border border-slate-700 text-slate-200 p-2.5 rounded-xl text-sm focus:outline-none focus:border-indigo-500">
                    <option value="4000">4 Seconds</option>
                    <option value="5000" selected>5 Seconds</option>
                    <option value="6000">6 Seconds</option>
                </select>
            </div>
            <div class="flex items-end">
                <div class="w-full text-right text-xs text-slate-400 pb-2">Status: <span id="statusText" class="text-indigo-400 font-medium">Ready (Smart AI Active)</span></div>
            </div>
        </div>

        <div class="flex gap-2 mb-4">
            <button id="generateBtn" onclick="startVideoGeneration()" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 px-4 rounded-xl shadow-lg transition duration-200 text-sm">
                Play Video
            </button>
            <button id="downloadBtn" disabled class="flex-1 bg-emerald-600 hover:bg-emerald-500 disabled:bg-slate-800 disabled:text-slate-600 text-white font-semibold py-3 px-4 rounded-xl shadow-lg transition duration-200 text-sm cursor-pointer disabled:cursor-not-allowed">
                Save Video (.webm)
            </button>
        </div>

        <div class="w-full aspect-video bg-black rounded-xl relative overflow-hidden border border-slate-700 shadow-inner flex items-center justify-center">
            <canvas id="renderCanvas" class="hidden"></canvas>
            <img id="sceneImage" crossorigin="anonymous" class="absolute inset-0 w-full h-full object-cover opacity-90" src="https://images.unsplash.com/photo-1509198397868-475647b2a1e5?w=800&auto=format&fit=crop&q=80" alt="AI Visual">
            <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-black/30 pointer-events-none"></div>
            <div id="sceneText" class="absolute inset-x-3 bottom-4 z-10 text-center font-bold text-white text-sm sm:text-base drop-shadow-[0_2px_4px_rgba(0,0,0,0.9)]">
                Press Play Video to Start
            </div>
            <div class="absolute top-2 right-2 z-20 bg-black/60 text-[10px] text-emerald-400 font-semibold px-2 py-0.5 rounded backdrop-blur-sm flex items-center gap-1">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Context AI Active
            </div>
        </div>

        <div class="w-full bg-slate-800 h-1.5 rounded-full mt-4 overflow-hidden">
            <div id="progressBar" class="bg-indigo-500 h-full w-0 transition-all duration-100"></div>
        </div>
    </div>

    <script>
        let synth = window.speechSynthesis;
        let isPlaying = false;
        let currentTimeout = null;
        let mediaRecorder;
        let recordedChunks = [];

        // Curated precise category visual pools to ensure 100% correct imagery based on text keywords
        const thematicPools = {
            horror: [
                "https://images.unsplash.com/photo-1509198397868-475647b2a1e5?w=800&auto=format&fit=crop&q=80", // creepy dark forest/estate
                "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=800&auto=format&fit=crop&q=80", // spooky mist
                "https://images.unsplash.com/photo-1508385082359-f38ae991e8f2?w=800&auto=format&fit=crop&q=80", // dark gloomy hall
                "https://images.unsplash.com/photo-1514539079130-25950c84af65?w=800&auto=format&fit=crop&q=80"  // mystery shadow
            ],
            animal: [
                "https://images.unsplash.com/photo-1557050543-4d5f4e07ef46?w=800&auto=format&fit=crop&q=80", // elephant
                "https://images.unsplash.com/photo-1534567153574-2b12153a87f0?w=800&auto=format&fit=crop&q=80", // jungle wildlife
                "https://images.unsplash.com/photo-1546182990-dffeafbe841d?w=800&auto=format&fit=crop&q=80", // lion/wild animal
                "https://images.unsplash.com/photo-1564349683136-77e08dba1ef7?w=800&auto=format&fit=crop&q=80"  // panda/cute animal
            ],
            general: [
                "https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=800&auto=format&fit=crop&q=80", // scenic universe/cinematic
                "https://images.unsplash.com/photo-1519681393784-d120267933ba?w=800&auto=format&fit=crop&q=80", // mountain night
                "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=800&auto=format&fit=crop&q=80"  // beach sunset
            ]
        };

        function getSmartImageUrl(sentence, index) {
            let lower = sentence.toLowerCase();
            let pool = thematicPools.general;

            // Check if sentence relates to horror/ghost/dark themes
            if (lower.includes('horror') || lower.includes('ghost') || lower.includes('dark') || lower.includes('manor') || lower.includes('shadow') || lower.includes('fear') || lower.includes('night') || lower.includes('blood') || lower.includes('creepy') || lower.includes('library')) {
                pool = thematicPools.horror;
            } 
            // Check if sentence relates to animals/jungle themes
            else if (lower.includes('elephant') || lower.includes('animal') || lower.includes('jungle') || lower.includes('lion') || lower.includes('tiger') || lower.includes('baby') || lower.includes('river')) {
                pool = thematicPools.animal;
            }

            return pool[index % pool.length];
        }

        function startVideoGeneration() {
            if (isPlaying) {
                stopVideo();
                return;
            }

            const rawText = document.getElementById('storyText').value.trim();
            if (!rawText) {
                alert("Kripya kuch script text enter karein!");
                return;
            }

            let sentences = rawText.split('.').map(s => s.trim()).filter(s => s.length > 0);
            if (sentences.length === 0) {
                alert("Kripya valid sentences enter karein!");
                return;
            }

            const sceneDuration = parseInt(document.getElementById('speedSelect').value);
            const btn = document.getElementById('generateBtn');
            const downloadBtn = document.getElementById('downloadBtn');
            const statusText = document.getElementById('statusText');
            
            btn.innerText = "Stop / Reset";
            btn.className = "flex-1 bg-rose-600 hover:bg-rose-500 text-white font-semibold py-3 px-4 rounded-xl shadow-lg transition duration-200 text-sm";
            downloadBtn.disabled = true;
            isPlaying = true;
            statusText.innerText = "Recording Video...";

            const canvas = document.getElementById('renderCanvas');
            canvas.width = 800;
            canvas.height = 450;
            const ctx = canvas.getContext('2d');

            let stream;
            try {
                stream = canvas.captureStream(30);
                mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
                recordedChunks = [];
                
                mediaRecorder.ondataavailable = function(e) {
                    if (e.data && e.data.size > 0) {
                        recordedChunks.push(e.data);
                    }
                };
                
                mediaRecorder.onstop = function() {
                    try {
                        let blob = new Blob(recordedChunks, { type: 'video/webm' });
                        let url = URL.createObjectURL(blob);
                        
                        downloadBtn.disabled = false;
                        downloadBtn.className = "flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 px-4 rounded-xl shadow-lg transition duration-200 text-sm cursor-pointer";
                        downloadBtn.onclick = function() {
                            let a = document.createElement('a');
                            a.href = url;
                            a.download = 'ai-story-video.webm';
                            document.body.appendChild(a);
                            a.click();
                            document.body.removeChild(a);
                        };
                    } catch(err) {
                        console.log("Blob error:", err);
                    }
                };
                
                mediaRecorder.start();
            } catch (err) {
                console.log("MediaRecorder init error:", err);
            }

            let currentIndex = 0;
            const totalSteps = sentences.length;
            const progressBar = document.getElementById('progressBar');

            function renderFrameAndProceed(imgElement, currentSentence) {
                if (!isPlaying) return;

                try {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(imgElement, 0, 0, canvas.width, canvas.height);
                    
                    let gradient = ctx.createLinearGradient(0, 250, 0, 450);
                    gradient.addColorStop(0, 'rgba(0,0,0,0)');
                    gradient.addColorStop(1, 'rgba(0,0,0,0.85)');
                    ctx.fillStyle = gradient;
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    
                    ctx.fillStyle = "#ffffff";
                    ctx.font = "bold 20px Inter, sans-serif";
                    ctx.textAlign = "center";
                    ctx.textBaseline = "bottom";
                    ctx.fillText(currentSentence, canvas.width / 2, canvas.height - 30);
                } catch(e) {
                    console.log("Canvas draw error:", e);
                }
            }

            function playScene() {
                if (!isPlaying || currentIndex >= sentences.length) {
                    stopVideo();
                    return;
                }

                let currentSentence = sentences[currentIndex] + ".";
                document.getElementById('sceneText').innerText = currentSentence;
                statusText.innerText = `Scene ${currentIndex + 1}/${totalSteps}`;
                
                // Get smart matching image URL based on sentence context
                let imgUrl = getSmartImageUrl(currentSentence, currentIndex);
                
                const imgElement = document.getElementById('sceneImage');
                let imageLoaded = false;
                
                imgElement.onload = function() {
                    if (!imageLoaded) {
                        imageLoaded = true;
                        renderFrameAndProceed(imgElement, currentSentence);
                    }
                };
                
                imgElement.onerror = function() {
                    if (!imageLoaded) {
                        imageLoaded = true;
                        imgElement.src = "https://images.unsplash.com/photo-1509198397868-475647b2a1e5?w=800&auto=format&fit=crop&q=80";
                        renderFrameAndProceed(imgElement, currentSentence);
                    }
                };

                imgElement.src = imgUrl;

                setTimeout(() => {
                    if (!imageLoaded && isPlaying) {
                        imageLoaded = true;
                        renderFrameAndProceed(imgElement, currentSentence);
                    }
                }, 1500);

                if (synth) {
                    synth.cancel();
                    let utterance = new SpeechSynthesisUtterance(currentSentence);
                    utterance.rate = 0.95;
                    synth.speak(utterance);
                }

                let progressPercent = ((currentIndex + 1) / totalSteps) * 100;
                progressBar.style.width = `${progressPercent}%`;

                currentIndex++;
                currentTimeout = setTimeout(playScene, sceneDuration);
            }

            playScene();
        }

        function stopVideo() {
            isPlaying = false;
            if (synth) synth.cancel();
            if (currentTimeout) clearTimeout(currentTimeout);
            
            try {
                if (mediaRecorder && mediaRecorder.state !== "inactive") {
                    mediaRecorder.stop();
                }
            } catch(e) {
                console.log("Recorder stop error:", e);
            }

            const btn = document.getElementById('generateBtn');
            btn.innerText = "Play Video";
            btn.className = "flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 px-4 rounded-xl shadow-lg transition duration-200 text-sm";
            
            document.getElementById('sceneText').innerText = "Video Finished! Click 'Save Video' to Download.";
            document.getElementById('statusText').innerText = "Finished (Ready)";
            document.getElementById('progressBar').style.width = "100%";
        }
    </script>
</body>
</html>
