<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Context Video Studio</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }

        h2 {
            font-size: 1.3rem;
            margin-bottom: 12px;
            text-align: center;
            color: var(--primary);
        }

        .input-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        textarea {
            width: 100%;
            height: 110px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: var(--text);
            padding: 10px;
            font-size: 0.95rem;
            resize: none;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        .controls-row {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .controls-row select {
            flex: 1;
            background: #0f172a;
            color: var(--text);
            border: 1px solid #334155;
            padding: 8px;
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .btn {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background: var(--primary-hover);
        }

        .video-viewport {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 10px;
            margin-top: 15px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #334155;
        }

        .video-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.7;
        }

        .video-text-overlay {
            position: relative;
            z-index: 2;
            padding: 15px;
            text-align: center;
            font-size: 1.1rem;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 0 2px 6px rgba(0,0,0,0.9);
        }

        .watermark {
            position: absolute;
            bottom: 6px;
            right: 10px;
            font-size: 0.7rem;
            color: rgba(255,255,255,0.7);
            z-index: 3;
            background: rgba(0,0,0,0.4);
            padding: 2px 6px;
            border-radius: 4px;
        }

        .progress-bar-container {
            width: 100%;
            height: 4px;
            background: #334155;
            margin-top: 10px;
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: var(--primary);
            transition: width 0.1s linear;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🎬 Smart Context Video Studio</h2>
        
        <div class="input-group">
            <label for="storyText">Apna Text/Script Yahan Daalein:</label>
            <textarea id="storyText">Once upon a time, a big elephant lived in a dense, green jungle. Every morning, he used to go near the cold water river to drink water and enjoy himself. Along with him, a cute baby elephant also used to play with its beautiful trunk. The other animals of the jungle also became his good friends, and everyone lived together happily.</textarea>
        </div>

        <div class="controls-row">
            <div>
                <label for="speedSelect">Scene Speed:</label>
                <select id="speedSelect">
                    <option value="3000">3 Seconds</option>
                    <option value="4000" selected>4 Seconds</option>
                    <option value="5000">5 Seconds</option>
                </select>
            </div>
        </div>

        <button id="generateBtn" class="btn" onclick="startVideoGeneration()">Play Video & Audio</button>

        <div class="video-viewport">
            <img id="sceneImage" class="video-bg" src="https://picsum.photos/seed/elephant/800/450" alt="Visual">
            <div id="sceneText" class="video-text-overlay">Press Play Video to Start</div>
            <div class="watermark">Studio App</div>
        </div>

        <div class="progress-bar-container">
            <div id="progressBar" class="progress-bar"></div>
        </div>
    </div>

    <script>
        let synth = window.speechSynthesis;
        let isPlaying = false;
        let currentTimeout = null;

        function extractKeyword(sentence) {
            const text = sentence.toLowerCase();
            if (text.includes('elephant')) return 'elephant';
            if (text.includes('jungle') || text.includes('forest') || text.includes('green')) return 'jungle';
            if (text.includes('river') || text.includes('water') || text.includes('drink')) return 'river';
            if (text.includes('lion') || text.includes('animal') || text.includes('friends')) return 'animals';
            return 'nature';
        }

        function startVideoGeneration() {
            if (isPlaying) {
                stopVideo();
                return;
            }

            const rawText = document.getElementById('storyText').value.trim();
            if (!rawText) {
                alert("Kripya kuch script text enter karein!");
                return;
            }

            // Safe text splitting using period (.) instead of complex regex to prevent freezing
            let sentences = rawText.split('.').map(s => s.trim()).filter(s => s.length > 0);

            const sceneDuration = parseInt(document.getElementById('speedSelect').value);
            const btn = document.getElementById('generateBtn');
            
            btn.innerText = "Stop / Reset";
            btn.style.background = "#ef4444";
            isPlaying = true;

            let currentIndex = 0;
            const totalSteps = sentences.length;
            const progressBar = document.getElementById('progressBar');

            function playScene() {
                if (!isPlaying || currentIndex >= sentences.length) {
                    stopVideo();
                    return;
                }

                let currentSentence = sentences[currentIndex] + ".";
                document.getElementById('sceneText').innerText = currentSentence;
                
                let exactKeyword = extractKeyword(currentSentence);
                document.getElementById('sceneImage').src = `https://picsum.photos/seed/${exactKeyword}/800/450?t=` + new Date().getTime();

                if (synth) {
                    synth.cancel();
                    let utterance = new SpeechSynthesisUtterance(currentSentence);
                    synth.speak(utterance);
                }

                let progressPercent = ((currentIndex + 1) / totalSteps) * 100;
                progressBar.style.width = `${progressPercent}%`;

                currentIndex++;
                currentTimeout = setTimeout(playScene, sceneDuration);
            }

            playScene();
        }

        function stopVideo() {
            isPlaying = false;
            if (synth) synth.cancel();
            if (currentTimeout) clearTimeout(currentTimeout);

            const btn = document.getElementById('generateBtn');
            btn.innerText = "Play Video & Audio";
            btn.style.background = "var(--primary)";
            
            document.getElementById('sceneText').innerText = "Video Stopped";
            document.getElementById('progressBar').style.width = "0%";
        }
    </script>
</body>
</html>
